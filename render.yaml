services:
  - type: web
    name: Gezx-compressor
    runtime: docker
    plan: free

    dockerfilePath: ./Dockerfile

    envVars:
      - key: BOT_TOKEN
        sync: false

      - key: API_ID
        sync: false

      - key: API_HASH
        sync: false

      - key: WORK_DIR
        value: /tmp/Gezx-compressor
